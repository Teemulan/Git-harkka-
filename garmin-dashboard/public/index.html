
<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garmin Sports Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>GARMIN SPORTS</h1>
        <p>Oma urheiludashboard</p>
    </header>

    <main>

        <section class="welcome">
            <h2>Tervetuloa!</h2>
            <p>Seuraa päivittäistä aktiivisuuttasi ja urheilusuorituksiasi.</p>
        </section>

        <section class="stats">

            <div class="stat-card">
                <h3>Askeleet</h3>
                <p id="steps">Ladataan...</p>
            </div>

            <div class="stat-card">
                <h3>Syke</h3>
                <p id="heart-rate">-- bpm</p>
            </div>

            <div class="stat-card">
                <h3>Kalorit</h3>
                <p id="calories">-- kcal</p>
            </div>

            <div class="stat-card">
                <h3>Uni</h3>
                <p id="sleep">--</p>
            </div>

        </section>

        <section class="workout">
            <h2>Viimeisin harjoitus</h2>
            <p id="workout">Harjoitustietoja ei vielä haettu.</p>
        </section>

    </main>

    <footer>
        <p>Garmin Sports Dashboard | 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
